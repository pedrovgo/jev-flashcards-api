spring:
  application:
    name: flashcards
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true

openrouter:
  api-key: ${OPENROUTER_API_KEY:}
  model: "typesafe/jev-1.13"
  instructions: "Compare a resposta do usuário com a resposta de referência pelo significado, não pela redação. Considere o contexto da pergunta, identificando equivalência de significado, erros conceituais, contradições e informações incorretas. Verifique se a resposta cobre os conceitos essenciais e se contém erros ou contradições. Não desconte pontos por paráfrases nem por omissões que não alterem o entendimento."
  criteria:
    - "0: Resposta completamente incorreta, ou sem relação com a pergunta, ou com pouquíssimo conteúdo em relação à resposta esperada."
    - "25: Resposta apresenta algum conhecimento, mas contém erros conceituais importantes e/ou está muito incompleta."
    - "50: Resposta razoavelmente correta, mas um pouco incompleta ou com poucas imprecisões."
    - "75: Resposta correta, mas apresenta pequenas omissões que podem afetar a compreensão."
    - "100: Resposta equivalente à resposta correta com todos os conceitos essenciais cobertos."